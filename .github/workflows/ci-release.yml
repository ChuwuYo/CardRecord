name: CI and Release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'build-apk-release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release: ${{ steps.tip.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Verify (ktlint, unit tests, lint)
        run: |
          ./gradlew ktlintCheck :app:testDebugUnitTest :app:lintDebug :app:lintRelease --stacktrace || {
            echo "::group::ktlint violation reports"
            find app/build/reports/ktlint -name '*.txt' -exec sh -c 'echo "== $1 =="; cat "$1"' _ {} \;
            echo "::endgroup::"
            exit 1
          }

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Check main tip
        id: tip
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main 已前进到 $tip，不为 $GITHUB_SHA 签名发布。"
          fi

  build-sign:
    name: Build and sign
    needs: verify
    if: ${{ needs.verify.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build
        uses: ./.github/actions/setup-android-build

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.CARDRECORD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cardrecord-release.p12"
          chmod 600 "$RUNNER_TEMP/cardrecord-release.p12"

      - name: Build release APK
        env:
          CARDRECORD_RELEASE_STORE_FILE: ${{ runner.temp }}/cardrecord-release.p12
          CARDRECORD_RELEASE_STORE_PASSWORD: ${{ secrets.CARDRECORD_RELEASE_STORE_PASSWORD }}
          CARDRECORD_RELEASE_KEY_ALIAS: ${{ secrets.CARDRECORD_RELEASE_KEY_ALIAS }}
          CARDRECORD_RELEASE_KEY_PASSWORD: ${{ secrets.CARDRECORD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Delete release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/cardrecord-release.p12"

      - name: Verify release signature
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.CARDRECORD_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$EXPECTED_CERT_SHA256"
          apk='app/build/outputs/apk/release/app-release.apk'
          actual="$(keytool -printcert -jarfile "$apk" | awk -F': ' '/SHA256:/{print $2; exit}')"
          test "$actual" = "$EXPECTED_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Read version name
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardrecord-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish rolling release
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cardrecord-release-apk
          path: release

      - name: Publish apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build-sign.outputs.version-name }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          apk='release/app-release.apk'
          digest="$(sha256sum "$apk" | awk '{print $1}')"

          require_main_tip() {
            local tip
            tip="$(gh api "$repo/git/ref/heads/main" --jq '.object.sha')"
            if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "::error::main 已前进到 $tip，拒绝用 $GITHUB_SHA 更新 apk-latest。"
              exit 1
            fi
          }

          require_main_tip
          release_id="$(gh api "$repo/releases/tags/apk-latest" --jq '.id')"
          staged_id="$(
            gh api --method POST \
              -H 'Content-Type: application/vnd.android.package-archive' \
              "https://uploads.github.com/$repo/releases/$release_id/assets?name=app-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.apk" \
              --input "$apk" --jq '.id'
          )"
          gh api -H 'Accept: application/octet-stream' "$repo/releases/assets/$staged_id" > "$RUNNER_TEMP/published.apk"
          test "$(sha256sum "$RUNNER_TEMP/published.apk" | awk '{print $1}')" = "$digest"

          require_main_tip
          gh api "$repo/releases/$release_id/assets" --paginate \
            --jq ".[] | select(.name | endswith(\".apk\")) | select(.id != $staged_id) | .id" \
            | while read -r old_id; do
                gh api --method DELETE "$repo/releases/assets/$old_id"
              done
          gh api --method PATCH "$repo/releases/assets/$staged_id" -f name='app-release.apk' > /dev/null

          printf '%s\n' \
            '自动构建的最新可安装 APK（使用 CardRecord 固定发布密钥签名；此 Release 是滚动测试渠道）。' \
            "- 版本：v$VERSION_NAME" \
            "- 提交：$GITHUB_SHA" \
            "- 分支：$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release edit apk-latest --repo "$GITHUB_REPOSITORY" \
            --title "最新测试包 v$VERSION_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease
          require_main_tip
          gh api --method PATCH "$repo/git/refs/tags/apk-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null

          test "$(gh api "$repo/git/ref/tags/apk-latest" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "$repo/releases/$release_id/assets" --paginate --jq '.[] | select(.name | endswith(".apk")) | .name')" = 'app-release.apk'
